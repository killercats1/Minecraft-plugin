# ServerCore messages. Color codes use '&'. {placeholders} are filled in by the plugin.
# Set a message to '' to disable it. Lists are sent as multiple lines.
prefix: '&8[&6&lServer&8] &7'

general:
  no-permission: '&cYou do not have permission to do that.'
  players-only: '&cOnly players can use this command.'
  player-not-found: '&cPlayer &f{player} &cwas not found.'
  invalid-amount: '&c''{input}'' is not a valid amount. Examples: 500, 2.5k, 1m'
  invalid-number: '&c''{input}'' must be a whole number between {min} and {max}.'
  invalid-duration: '&c''{input}'' is not a valid duration. Examples: 30m, 1h30m, 2d'
  insufficient-funds: '&cYou need &f{amount} &cfor that.'
  transaction-failed: '&cThe transaction failed. No money was taken.'
  inventory-full: '&cYour inventory is full.'
  cooldown: '&cPlease wait &f{time} &cbefore doing that again.'
  usage: '&cUsage: &f{usage}'
  error: '&cSomething went wrong. Please tell a staff member.'
  nothing-here: '&7Nothing to show.'
  economy-unavailable: '&cThe economy is currently unavailable (Vault/EssentialsX not loaded).'
  reloaded: '&aServerCore configuration reloaded.'
  version: '&7ServerCore &f{version} &8| &7Economy: &f{economy} &8| &7EssentialsX: &f{essentials}'
  help:
    - '&8&m------------&r &6&lServerCore &8&m------------'
    - '&e/maintenance &7- Maintenance mode controls'
    - '&e/bank &7- Your bank account'
    - '&e/pay <player> <amount> &7- Send money'
    - '&e/banknote <amount> &7- Withdraw money as a note'
    - '&e/sell [hand|all] &7- Sell items to the server'
    - '&e/worth [item] &7- Check item prices'
    - '&e/ah &7- Auction house'
    - '&e/daily &7- Daily reward'
    - '&e/bounty &7- Bounties'
    - '&e/lottery &7- Lottery'
    - '&e/transactions &7- Your money history'
    - '&e/scoreboard &7- Toggle sidebar'
    - '&e/servercore reload &7- Reload configs'

maintenance:
  unknown-end: 'unknown'
  kick-message:
    - '&c&lSERVER MAINTENANCE'
    - ''
    - '&7We are currently performing maintenance.'
    - '&7Reason: &f{reason}'
    - '&7Expected back in: &e{remaining}'
    - ''
    - '&7Follow our Discord for updates!'
  join-reminder: '&cMaintenance mode is ON &7({reason}, ends in &f{remaining}&7).'
  join-attempt: '&e{player} &7tried to join during maintenance.'
  enabled-broadcast: '&c&lMaintenance mode enabled &7by {actor}: &f{reason}&7. Non-staff players will be disconnected.'
  disabled-broadcast: '&a&lMaintenance mode disabled! &7Everyone can join again.'
  scheduled-broadcast: '&cThe server enters maintenance in &f{time}&c: &7{reason}'
  countdown: '&cMaintenance starts in &f{time}&c! &7({reason})'
  enabled: '&aMaintenance mode enabled. Ends in: &f{remaining}'
  disabled: '&aMaintenance mode disabled.'
  already-enabled: '&cMaintenance mode is already enabled.'
  already-disabled: '&cMaintenance mode is not enabled.'
  scheduled: '&aMaintenance scheduled to start in &f{time}&a.'
  schedule-cancelled: '&aScheduled maintenance cancelled.'
  no-schedule: '&cNo maintenance is scheduled.'
  reason-set: '&aMaintenance reason set to: &f{reason}'
  extended: '&aMaintenance now ends in &f{remaining}&a.'
  whitelist-added: '&a{player} can now join during maintenance.'
  whitelist-already: '&c{player} is already on the maintenance whitelist.'
  whitelist-removed: '&a{player} was removed from the maintenance whitelist.'
  whitelist-missing: '&c{player} is not on the maintenance whitelist.'
  whitelist-list: '&7Maintenance whitelist (&f{count}&7): &f{players}'
  ranks-list: '&7Allowed ranks: &f{ranks} &8(+ ops and servercore.maintenance.bypass)'
  status-on:
    - '&8&m----------&r &c&lMaintenance &8&m----------'
    - '&7Status: &c&lENABLED'
    - '&7Reason: &f{reason}'
    - '&7Enabled by: &f{actor} &7at &f{since}'
    - '&7Ends in: &f{remaining}'
  status-off:
    - '&8&m----------&r &a&lMaintenance &8&m----------'
    - '&7Status: &a&lDISABLED'
  status-scheduled: '&7Scheduled to start in &f{time}&7.'
  help:
    - '&8&m----------&r &6&lMaintenance &8&m----------'
    - '&e/{label} on [duration] [reason] &7- Enable now'
    - '&e/{label} off &7- Disable'
    - '&e/{label} schedule <delay> [duration] [reason] &7- Countdown'
    - '&e/{label} cancel &7- Cancel the countdown'
    - '&e/{label} extend <duration> &7- Extend the end time'
    - '&e/{label} reason <text> &7- Change the reason'
    - '&e/{label} add|remove <player> &7- Maintenance whitelist'
    - '&e/{label} list &7- Whitelist and allowed ranks'
    - '&e/{label} status &7- Current status'

