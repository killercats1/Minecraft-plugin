# Sell prices per single item for /sell and /worth (1.8.8 material names).
# Use MATERIAL for all variants or MATERIAL:data for one variant (e.g. WOOL:14 = red wool).
# A specific MATERIAL:data entry wins over a plain MATERIAL entry.
# Damaged tools/armor are paid proportionally to their remaining durability.
# Anything a farm can produce without limit (crops, mob grinders, iron golems, cobble generators)
# is priced low on purpose; resources you have to go and mine (diamonds, gold ore, lapis) pay best.
