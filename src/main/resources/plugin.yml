name: ServerCore
version: '${project.version}'
main: com.killercats.servercore.ServerCore
description: ${project.description}
author: killercats1
website: https://github.com/killercats1/Minecraft-plugin
softdepend: [Votifier, NuVotifier, Vault, LoginSecurity, AuthMe, GriefPrevention, CoreProtect, NoCheatPlus, Essentials, PlaceholderAPI, LuckPerms, PermissionsEx, GroupManager, zPermissions, bPermissions]

commands:
  servercore:
    description: ServerCore help, version and reload.
    aliases: [core]
  maintenance:
    description: Control maintenance mode.
    aliases: [maint]
  staffchat:
    description: Talk in the private staff channel or toggle it.
    aliases: [sc, adminchat, ac]
  scoreboard:
    description: Toggle the sidebar scoreboard.
    aliases: [sb]
  pay:
    description: Send money to another player.
    aliases: [givemoney]
  paytoggle:
    description: Toggle whether you accept payments.
    aliases: [togglepay]
  bank:
    description: Manage your bank account.
    aliases: [banks]
  banknote:
    description: Withdraw money as a physical banknote.
    aliases: [note, withdrawnote, cheque, check]
  sell:
    description: Sell items to the server.
    aliases: [sellgui]
  worth:
    description: Check how much an item sells for.
    aliases: [price]
  daily:
    description: Claim your daily reward.
    aliases: [dailyreward, reward]
  bounty:
    description: Place and view bounties.
    aliases: [bounties]
  lottery:
    description: Join the lottery.
    aliases: [lotto, jackpot]
  auction:
    description: Open the auction house.
    aliases: [ah, auctionhouse, auctions, market]
  transactions:
    description: View money transaction history.
    aliases: [txlog, history, moneylog]
  ecostats:
    description: Economy statistics.
    aliases: [economystats]
  ecoadmin:
    description: Economy administration.
    aliases: [economyadmin]
  headfix:
    description: Player head fix for Eaglercraft (status, check, fix, give).
    aliases: [hf, skullfix]
  vote:
    description: Vote for the server and get rewards (top, test).
    aliases: [votes]
  lagguard:
    description: Lag protection (TPS, ground item clearing, busiest chunks).
    aliases: [lguard]
  punish:
    description: Punish a player (menu with preset reasons, or warn/kick/mute/tempban/ban).
    aliases: [punishment]
  warn:
    description: Warn a player.
  unpunish:
    description: Lift a ban or mute.
    aliases: [unpunishment]
  phistory:
    description: A player's punishment history.
    aliases: [punishments, phist]
  alts:
    description: Accounts that joined from the same IP.
    aliases: [dupeip]
  rules:
    description: Show the server rules (and accept them).
    aliases: [serverrules]
  crate:
    description: Crates and keys.
    aliases: [crates, keys]
  store:
    description: Link to the server store.
    aliases: [buy, donate]

permissions:
  servercore.*:
    description: Everything.
    default: op
    children:
      servercore.admin: true
      servercore.player: true
      servercore.maintenance: true
      servercore.maintenance.bypass: true
      servercore.maintenance.notify: true
      servercore.staffchat: true
      servercore.ecoadmin: true
      servercore.ecostats: true
      servercore.transactions.others: true
      servercore.banknote.lookup: true
      servercore.banknote.alerts: true
      servercore.bounty.admin: true
      servercore.lottery.admin: true
      servercore.auction.admin: true
      servercore.pay.bypasscooldown: true
      servercore.pay.bypasstoggle: true
      servercore.backup: true
      servercore.headfix: true
      servercore.headfix.give: true
      servercore.lagguard: true
      servercore.lagguard.notify: true
      servercore.chatguard.bypass: true
      servercore.chatguard.notify: true
      servercore.vote.admin: true
      servercore.staff: true
      servercore.punish: true
      servercore.punish.mute: true
      servercore.punish.tempban: true
      servercore.punish.ban: true
      servercore.punish.unban: true
      servercore.punish.unmute: true
      servercore.punish.history: true
      servercore.punish.alts: true
      servercore.punish.notify: true
      servercore.spawnprotection.bypass: true
      servercore.crate.admin: true
  servercore.player:
    description: All normal player features.
    default: true
    children:
      servercore.scoreboard: true
      servercore.pay: true
      servercore.paytoggle: true
      servercore.bank: true
      servercore.bank.transfer: true
      servercore.bank.top: true
      servercore.bank.interest: true
      servercore.banknote: true
      servercore.banknote.redeem: true
      servercore.sell: true
      servercore.sell.all: true
      servercore.worth: true
      servercore.daily: true
      servercore.payday: true
      servercore.payday.rank.default: true
      servercore.bounty: true
      servercore.bounty.place: true
      servercore.bounty.claim: true
      servercore.lottery: true
      servercore.auction: true
      servercore.auction.sell: true
      servercore.transactions: true
      servercore.announcer.receive: true
      servercore.vote: true
      servercore.crate: true
  servercore.vote:
    description: Use /vote and /vote top.
    default: true
  servercore.vote.admin:
    description: Use /vote test <player> to simulate a vote.
    default: op
  servercore.staff:
    description: Marks a staff account. Staff accounts are locked if no login plugin is running.
    default: op
  servercore.punish:
    description: Use /punish (menu, warnings, kicks) and /warn.
    default: op
  servercore.punish.mute:
    description: Mute players.
    default: op
  servercore.punish.tempban:
    description: Temporarily ban players.
    default: op
  servercore.punish.ban:
    description: Permanently ban players.
    default: op
  servercore.punish.unban:
    description: Lift bans with /unpunish.
    default: op
  servercore.punish.unmute:
    description: Lift mutes with /unpunish.
    default: op
  servercore.punish.history:
    description: See punishment history with /phistory.
    default: op
  servercore.punish.alts:
    description: See alt accounts with /alts.
    default: op
  servercore.punish.notify:
    description: See punishments and ban-evasion alerts.
    default: op
  servercore.punish.exempt:
    description: Cannot be punished by other players (console still can).
    default: false
  servercore.spawnprotection.bypass:
    description: Build and break inside spawn protection.
    default: op
  servercore.rules.exempt:
    description: Never asked to accept the rules.
    default: false
  servercore.combattag.bypass:
    description: Never combat tagged.
    default: false
  servercore.crate:
    description: Open crates with keys.
    default: true
  servercore.crate.admin:
    description: Give/take keys and place crate blocks.
    default: op
  servercore.admin:
    description: Reload the plugin.
    default: op
  servercore.backup:
    description: Run /servercore backup and see backup messages.
    default: op
  servercore.headfix:
    description: Use /headfix (status, check, fix, reseed, who).
    default: op
  servercore.headfix.give:
    description: Give yourself fixed player heads with /headfix give.
    default: op
  servercore.lagguard:
    description: Use /lagguard (status, chunks, sweep, tp).
    default: op
  servercore.lagguard.notify:
    description: Get lag alerts with the busiest chunks.
    default: op
  servercore.chatguard.bypass:
    description: Not affected by the chat cooldown, advertising and word filters.
    default: op
  servercore.chatguard.notify:
    description: See blocked advertising attempts.
    default: op
  servercore.maintenance:
    description: Use /maintenance.
    default: op
  servercore.maintenance.bypass:
    description: Join while maintenance mode is enabled.
    default: op
  servercore.maintenance.notify:
    description: Get notified when someone is blocked by maintenance.
    default: op
  servercore.staffchat:
    description: Read and write staff chat.
    default: op
  servercore.ecoadmin:
    description: Economy administration commands.
    default: op
  servercore.ecostats:
    description: View economy statistics.
    default: op
  servercore.transactions.others:
    description: View other players' transactions.
    default: op
  servercore.banknote.lookup:
    description: Look up banknote ids.
    default: op
  servercore.banknote.alerts:
    description: Receive duplicate banknote alerts.
    default: op
  servercore.bounty.admin:
    description: Remove bounties.
    default: op
  servercore.bounty.exempt:
    description: Cannot receive bounties.
    default: false
  servercore.lottery.admin:
    description: Force lottery draws and add to the pot.
    default: op
  servercore.auction.admin:
    description: Cancel any auction listing.
    default: op
  servercore.auction.nofee:
    description: No auction listing fee.
    default: false
  servercore.pay.notax:
    description: Payments are not taxed.
    default: false
  servercore.pay.bypasscooldown:
    description: No /pay cooldown.
    default: op
  servercore.pay.bypasstoggle:
    description: Pay players who disabled payments.
    default: op
  servercore.bank.nofee:
    description: No bank withdraw/transfer fees.
    default: false
  servercore.banknote.nofee:
    description: No banknote fee.
    default: false
