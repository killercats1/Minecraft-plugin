# =====================================================================
#  ServerCore for LilMonkeySMP (lilmonkeysmp.eagler.host)
#  Maintenance mode, advanced economy & server essentials
#  Built for Spigot/Paper 1.8.8. Economy runs on Vault + EssentialsX.
# =====================================================================

# ---------------------------------------------------------------------
# Storage: sqlite (default, zero setup) or mysql (for networks).
# ---------------------------------------------------------------------
storage:
  type: sqlite
  sqlite-file: data.db
  autosave-minutes: 5
  mysql:
    host: localhost
    port: 3306
    database: minecraft
    username: root
    password: ''
    use-ssl: false

# ---------------------------------------------------------------------
# Maintenance mode
# ---------------------------------------------------------------------
maintenance:
  # Operators can always join while maintenance is on.
  # Ranks (permission groups, read through Vault - LuckPerms, PermissionsEx,
  # GroupManager, ...) that may join during maintenance. Case-insensitive.
  # Alternatively give a rank the permission servercore.maintenance.rank.<name>
  # or servercore.maintenance.bypass.
  allowed-ranks:
    - owner
    - admin
    - moderator
    - helper
    - developer
    - builder
  # Seconds between enabling maintenance and kicking players who may not stay.
  kick-delay-seconds: 5
  default-reason: 'Scheduled maintenance'
  # Seconds before a scheduled maintenance at which a countdown is broadcast.
  countdown-broadcasts: [900, 600, 300, 120, 60, 30, 15, 10, 5, 4, 3, 2, 1]
  # Tell staff (servercore.maintenance.notify) when someone is blocked.
  notify-staff-on-attempt: true
  # Server list MOTD while maintenance is on. {reason} {remaining}
  motd:
    enabled: true
    line1: '&6&lLilMonkeySMP &8- &c&lMAINTENANCE'
    line2: '&7{reason} &8| &eBack in: &f{remaining}'
  # Max players shown in the server list during maintenance (-1 = unchanged).
  max-players-display: 0

# ---------------------------------------------------------------------
# Economy (wallet balances are stored by EssentialsX through Vault,
# so /bal, /baltop and /eco keep working as usual)
# ---------------------------------------------------------------------
economy:
  currency-symbol: '$'
  symbol-after-amount: false
  number-format: '#,##0.00'
  # Hard cap for a single typed amount (protects against typos like 1e20).
  max-transaction: 1000000000000
  transaction-log:
    enabled: true
    # Also record balance changes made by EssentialsX commands.
    log-essentials: true
    # EssentialsX UserBalanceUpdateEvent causes to record.
    essentials-causes: [COMMAND_ECO, COMMAND_PAY, COMMAND_SELL]

# Passive income (bank interest, payday) is not paid to AFK players.
# EssentialsX AFK status is used when available, plus this inactivity timer.
afk:
  inactivity-timeout-seconds: 300

pay:
  # true: /pay is handled by ServerCore (EssentialsX automatically defers to it).
  # false: /pay is passed through to EssentialsX.
  override-essentials: true
  min-amount: 1
  # Percentage removed from every payment (money sink). Bypass: servercore.pay.notax
  tax-percent: 0.0
  cooldown-seconds: 3
  # Payments at or above this amount need /pay confirm (0 = never).
  confirm-above: 100000
  # Allow paying players who are offline (they must have joined before).
  allow-offline: true

bank:
  withdraw-fee-percent: 0.0
  transfer-fee-percent: 1.0
  # Interest is the biggest money printer in the economy (it compounds), so rates are kept low.
  interest:
    enabled: true
    interval-minutes: 60
    # AFK players don't earn interest.
    require-active: true
    # Max interest per player per payout (0 = unlimited).
    max-payout: 5000
    min-balance: 100
  # Tier 1 is the default. Optional 'permission' locks a tier to a rank.
  tiers:
    - name: '&7Basic'
      cost: 0
      max-balance: 100000
      interest-percent: 0.1
    - name: '&fSilver'
      cost: 25000
      max-balance: 500000
      interest-percent: 0.15
    - name: '&6Gold'
      cost: 150000
      max-balance: 2500000
      interest-percent: 0.2
    - name: '&bDiamond'
      cost: 750000
      max-balance: 10000000
      interest-percent: 0.25
    - name: '&5&lElite'
      cost: 3000000
      max-balance: 50000000
      interest-percent: 0.3
      permission: servercore.bank.tier.elite

banknotes:
  material: PAPER
  name: '&a&lBanknote &7({amount})'
  lore:
    - '&7Value: &a{amount}'
    - '&7Signed by: &f{creator}'
    - '&7Issued: &f{date}'
    - ''
    - '&eRight-click to redeem'
  min-amount: 10
  max-amount: 10000000
  max-per-command: 16
  # Small fee when printing a banknote (money sink).
  fee-percent: 1.0

sell:
  # Items with custom names or lore can't be sold (protects special items).
  allow-custom-items: false
  # Closing the /sell menu without pressing a button: true = sell, false = return items.
  gui-sell-on-close: false
  dynamic-pricing:
    enabled: true
    # Server-wide units that must be sold before an item's price halves.
    units-until-half-price: 2000
    # Price never drops below this fraction of the base price.
    min-multiplier: 0.25
    # How fast the market recovers (percent of the sold counter removed every minute).
    recovery-percent-per-minute: 0.5
  # Rank sell boosts. Players get the highest multiplier they have permission for.
  multipliers:
    vip:
      permission: servercore.sell.multiplier.vip
      multiplier: 1.1
    mvp:
      permission: servercore.sell.multiplier.mvp
      multiplier: 1.25
    elite:
      permission: servercore.sell.multiplier.elite
      multiplier: 1.5

daily:
  cooldown-hours: 24
  # Missing a day for longer than this resets the streak.
  streak-reset-hours: 48
  base-reward: 250
  streak-bonus-per-day: 50
  max-streak: 14
  remind-on-join: true
  # servercore.daily.rank.<name> -> reward multiplier
  rank-multipliers:
    vip: 1.25
    mvp: 1.5
    elite: 2.0
  # Extra reward on exact streak days.
  milestones:
    7: 2500
    14: 5000
    30: 15000
    100: 50000

payday:
  enabled: true
  # Minutes of active (non-AFK) play per payday.
  interval-minutes: 60
  # servercore.payday.rank.<name> -> salary. Highest one applies.
  ranks:
    default: 150
    vip: 250
    mvp: 375
    elite: 500
    staff: 300

bounty:
  min-amount: 1000
  # Percentage removed when placing a bounty (money sink).
  tax-percent: 10
  cooldown-seconds: 60
  # Contributors can't collect a bounty they helped fund.
  block-contributor-claim: true
  # Killer and victim on the same public IP can't collect (alt farming).
  # Local/proxy addresses are ignored, so this is safe behind Eaglercraft/BungeeCord proxies.
  block-same-ip: true

lottery:
  enabled: true
  ticket-price: 100
  max-tickets-per-player: 50
  draw-interval-minutes: 60
  # Percentage of ticket money kept by the server (money sink).
  house-cut-percent: 10
  min-players: 2
  refund-if-not-enough-players: true

auction:
  duration-hours: 48
  min-price: 1
  max-price: 1000000000
  # Charged when listing (not refunded).
  listing-fee-percent: 2
  # Taken from the seller's earnings.
  sales-tax-percent: 5
  default-listing-limit: 5
  # servercore.auction.limit.<number> raises the limit.
  limit-permissions: [10, 15, 25, 50]
  broadcast-new-listings: true
  blacklist:
    - BEDROCK
    - BARRIER
    - COMMAND
    - MOB_SPAWNER
    - DRAGON_EGG

# One-time reward for linking a Discord account with DiscordSRV.
# In plugins/DiscordSRV/config.yml set:
#   MinecraftDiscordAccountLinkedConsoleCommands: ["servercore linkreward %minecraftuuid% %discordid%", "", ""]
# Each Minecraft account and each Discord account can only get it once (unlinking/relinking gives nothing).
discord-link-reward:
  enabled: true
  money: 500
  # Extra console commands run with the reward. Placeholders: {player} {uuid} {discordid}
  # Example: 'lp user {player} permission set servercore.sell.multiplier.vip true'
  commands: []
  broadcast: true

# Vote rewards. Server lists send votes to NuVotifier (install it as a separate plugin), and
# ServerCore gives the rewards. Votes for offline players are saved and paid when they next join.
# Test without a real vote: /vote test <player>
votes:
  enabled: true
  # Shown (clickable) in /vote.
  links:
    - name: 'TopEaglerServers'
      url: 'https://topeaglerservers.com/vote/f062fb84'
  # Money per vote (needs Vault + an economy). 0 = none.
  money: 250
  # Extra console commands per vote. Placeholders: {player} {uuid} {service}
  # Example: 'give {player} diamond 1'. The default gives a Vote Crate key (/crate).
  commands: ['crate givekey {player} vote 1']
  # Tell everyone online when someone votes.
  broadcast: true
  # Save votes for offline players and reward them when they join. false = offline votes give nothing.
  offline-rewards: true
  # Remind players to vote when they join if they haven't voted in the last 24 hours.
  remind-on-join: true

# ---------------------------------------------------------------------
# Other features
# ---------------------------------------------------------------------
scoreboard:
  enabled: true
  update-ticks: 40
  title: '&6&lLILMONKEY SMP'
  disabled-worlds: []
  # Placeholders: {player} {rank} {balance} {bank} {bounty} {lottery} {streak}
  # {online} {max} {world} {maintenance} {client} {tps} {combat} and any PlaceholderAPI %placeholder%.
  # Max 15 lines, each line max 32 visible characters.
  lines:
    - '&7&m----------------'
    - '&fRank: &e{rank}'
    - '&fMoney: &a{balance}'
    - '&fBank: &a{bank}'
    - '&r'
    - '&fBounty: &c{bounty}'
    - '&fStreak: &6{streak} days'
    - '&fLottery: &6{lottery}'
    - '&r&r'
    - '&fOnline: &b{online}/{max}'
    - '&7&m----------------&r'
    - '&elilmonkeysmp.eagler.host'

announcer:
  enabled: true
  interval-seconds: 300
  random: false
  prefix: '&8[&6LilMonkey&8] &7'
  messages:
    - 'Welcome to &6LilMonkeySMP&7! Invite your friends: &elilmonkeysmp.eagler.host'
    - 'Earn money with &f/sell&7, then keep it safe with &f/bank&7 - it even earns interest!'
    - 'Claim your daily reward every day with &f/daily&7 to build a streak.'
    - 'Trade with other players on the auction house: &f/ah'
    - 'Try your luck in the &6lottery&7: &f/lottery'
    - 'Need cash in your hands? Create a banknote with &f/banknote <amount>'
    - 'Talk to nearby players with &aproximity voice chat&7! Type &f/audio&7, open the link and allow your microphone.'

# Chat format with rank prefixes from LuckPerms, e.g. "[Owner] Killercats2154: hi".
# Placeholders: {prefix} {suffix} {displayname} {name} {group} {world} {message} + PlaceholderAPI %placeholders%
# Not used while EssentialsX Chat is installed (remove EssentialsXChat to use this).
chat-format:
  enabled: true
  format: '{prefix}{displayname}{suffix}&7: {message}'
  # Color of the message text.
  message-color: '&f'
  # Optional format per rank (LuckPerms primary group), overrides 'format'. Example:
  #   owner: '{prefix}{displayname}&7: &c{message}'
  group-formats: {}
  # Players with this permission can use & color codes in chat (VIP and staff in the rank setup).
  color-permission: essentials.chat.color

# Chat protection: cooldown, repeated messages, advertising, CAPS and a word filter.
# Bypass: servercore.chatguard.bypass   Staff alerts: servercore.chatguard.notify
chat-guard:
  enabled: true
  # Minimum time between two chat messages from the same player.
  cooldown-millis: 1500
  # Block sending the same message again within this many seconds.
  block-repeats: true
  repeat-window-seconds: 30
  # Block IP addresses and website/server addresses (e.g. other Eaglercraft servers).
  block-advertising: true
  # Addresses that are always allowed.
  allowed-links:
    - lilmonkeysmp.eagler.host
  # Messages with more than this percentage of capital letters are lowercased (0 = off).
  caps-limit-percent: 60
  caps-min-length: 6
  # Words replaced with *** (whole words, any case). Add your own.
  blocked-words: []
  # Private-message commands that are also checked for advertising and blocked words.
  check-commands: [msg, tell, w, whisper, m, t, pm, r, reply, mail, me]

# Player head fix for Eaglercraft (EaglercraftX 1.8) players.
# Eaglercraft only draws a head's skin if the head stores a player UUID. On an offline-mode server
# heads made from a name usually have none (Steve) or get a stranger's premium skin. ServerCore gives
# heads of players it knows their real UUID and skin, so they show up for Eaglercraft AND Java players.
# Decorative heads with a skin URL (HeadDB etc.) also need eagler.host's skin downloads to be on:
# use /headfix check on such a head to see what Eaglercraft will draw.
head-fix:
  enabled: true
  # auto: PERMANENT FIRST - a head uses the owner's own skin URL (e.g. a SkinsRestorer /skin skin), which
  #       works even when the owner is offline. Only players without one fall back to their live browser
  #       skin (Eaglercraft can only get that while they're online; Steve/Alex when offline).
  # live: always the live browser skin.   url: always the skin URL (never the live browser skin).
  # Note: a browser-only skin can't be made permanent by any server plugin - it only exists in eagler.host's
  # gateway while the player is online. Players can make theirs permanent with /skin.
  skin-source: auto
  # Tell players with a browser-only skin (once per restart) how to make their head permanent with /skin.
  permanent-skin-tip: true
  # Skin URLs that are not anyone's own skin (e.g. a default skin the gateway gives every Eaglercraft
  # player). URLs shared by 2+ Eaglercraft players are ignored automatically.
  ignored-skin-urls: []
  # Skin hosts the Eaglercraft gateway downloads from (its default is only textures.minecraft.net).
  url-hosts: [textures.minecraft.net]
  # Pre-fill Spigot's head cache so every new head (/skull, menus, other plugins) is fixed instantly.
  seed-skin-cache: true
  max-seeded: 1500
  remember-days: 90
  max-remembered: 2000
  resnapshot-minutes: 5
  reseed-minutes: 20
  # Re-send a joining Eaglercraft player to other Eaglercraft players (a short tab-list flicker), so a
  # head they looked at while the player was offline doesn't leave that player looking like Steve.
  refresh-viewers-on-join: true
  # Also recognise Eaglercraft players by their client brand.
  detect-brand: true
  repair:
    inventories: true
    sweep-seconds: 30
    containers: true
    dropped-items: true
    placed-heads: true
    frames-and-stands: true
    chunks-per-tick: 4
    # Give decorative heads that have a skin but no UUID a stable UUID so Eaglercraft can draw them.
    textured-without-id: true
    # Also take over heads of names that belong to a premium (Mojang) account with a different UUID.
    premium-namesakes: false
  log-repairs: false

# Lag protection for a small host and browser (Eaglercraft) players.
lag-guard:
  enabled: true
  excluded-worlds: []
  # Clears old items lying on the ground. Never: named/lored items (QualityArmory guns, renamed gear),
  # banknotes, enchanted items, the keep-materials below, display items, or items near a recent death.
  item-sweep:
    enabled: true
    interval-minutes: 10
    min-age-seconds: 180
    warn-seconds: [60, 10, 3]
    broadcast: true
    skip-named-or-lored: true
    skip-enchanted: true
    keep-materials: [SKULL_ITEM, DIAMOND, DIAMOND_BLOCK, EMERALD, EMERALD_BLOCK, BEACON, NETHER_STAR, DRAGON_EGG, ENCHANTED_BOOK]
    death-protection-minutes: 5
    death-protection-radius: 10
  # Blocks NEW mobs from breeding/spawners/eggs when a chunk already has too many. Existing mobs are never killed.
  spawn-caps:
    enabled: true
    # (DISPENSE_EGG is left out on purpose: a capped dispenser would use up the egg.)
    reasons: [BREEDING, SPAWNER, EGG, SPAWNER_EGG, BUILD_SNOWMAN, BUILD_IRONGOLEM, SLIME_SPLIT]
    per-type-per-chunk: 24
    # Per-mob limits. Use "overrides: {}" to have no overrides.
    overrides:
      CHICKEN: 32
    animals-per-chunk: 48
    notify-radius: 8
  # When TPS stays low: an early item clear, natural mob spawns paused, staff get the laggiest chunks.
  emergency:
    enabled: true
    enter-below: 15.0
    sustain-seconds: 60
    exit-above: 18.0
    early-sweep: true
    block-natural-spawns: true
    alert-top-chunks: 5
    alert-cooldown-minutes: 5

# Automatic backups of the worlds, plugin data and player lists (zip files).
# They are stored on the same disk as the server: download them now and then from the file manager!
backups:
  enabled: true
  interval-hours: 12
  # How many backup zips to keep; older ones are deleted (free hosts have little disk space).
  keep: 2
  # Folder in the main server directory.
  folder: backups
  # Plugin folders to include (jar files are always skipped).
  include-plugins: [ServerCore, LuckPerms, Essentials, DiscordSRV, LoginSecurity, Jobs, DecentHolograms, VillagerMarket, MineResetLite,
    GriefPreventionData, NoCheatPlus, Votifier]
  # Off-site copy: every finished backup is also uploaded to a Discord channel, so a host failure
  # can't take your only backups. In Discord: channel settings > Integrations > Webhooks > New Webhook
  # > Copy Webhook URL, and paste it here. Use a private channel only staff can see!
  # Big backups are split into parts (.zip.001, .zip.002, ...): download every part into one folder
  # and open the .001 file with 7-Zip to restore.
  discord:
    webhook-url: ''
    # Discord allows 10 MB per file on servers without boosts. Raise it if your server is boosted.
    part-size-mb: 9
    # Backups bigger than this are not uploaded (Discord gets a notice instead).
    max-upload-mb: 250
    server-name: 'LilMonkeySMP'

# ---------------------------------------------------------------------
# Security
# ---------------------------------------------------------------------
security:
  # Eaglercraft servers run in offline mode, so without a login plugin anyone can join with your name.
  # ServerCore looks for LoginSecurity, AuthMe, nLogin, JPremium and other login plugins.
  #   protect = if no login plugin is running, ops and staff (servercore.staff or maintenance bypass)
  #             can't join until one is installed. Players are not affected.
  #   warn    = staff can join but get a warning.
  #   off     = no check.
  login-check:
    mode: protect
    # Set to true if players log in on the proxy (e.g. EaglerXServer auth on BungeeCord/Velocity).
    auth-on-proxy: false
    # Other login plugins to accept (their plugin names).
    extra-login-plugins: []

# Warnings, kicks, mutes and bans with history (/punish, /warn, /unpunish, /phistory, /alts).
punishments:
  enabled: true
  # Accounts that join from the same IP as a banned account (ban evasion):
  #   alert = staff are told, block = they can't join, off = nothing.
  # Players behind a proxy without IP forwarding all share one address; ServerCore ignores those.
  ban-evasion: alert
  # Tell everyone (not just staff) when someone is banned or kicked.
  broadcast-bans: true
  # Shown on the ban screen. For example your Discord invite.
  appeal: 'Appeal on our Discord'
  # Log every punishment to a Discord channel (webhook URL, see backups.discord). Empty = off.
  discord-webhook-url: ''
  # Commands a muted player can't use.
  muted-blocked-commands: [msg, tell, w, whisper, m, t, pm, r, reply, mail, me, say, helpop, ac, sc]
  # Buttons in /punish <player>. Each offence of the same kind moves one step down its list
  # (the last step repeats). Steps: warn, kick, mute <time>, mute, tempban <time>, ban.
  # Times: 30m, 2h, 7d, 4w. "mute" or "ban" without a time is permanent.
  presets:
    hacking:
      name: '&cHacking / cheat client'
      icon: DIAMOND_SWORD
      reason: 'Hacking'
      steps: ['tempban 7d', 'tempban 30d', 'ban']
    xray:
      name: '&bX-ray'
      icon: DIAMOND_ORE
      reason: 'X-ray'
      steps: ['tempban 3d', 'tempban 14d', 'ban']
    griefing:
      name: '&6Griefing / stealing'
      icon: TNT
      reason: 'Griefing'
      steps: ['tempban 3d', 'tempban 14d', 'ban']
    spam:
      name: '&eSpam'
      icon: PAPER
      reason: 'Spamming'
      steps: ['warn', 'mute 30m', 'mute 2h', 'mute 1d']
    toxicity:
      name: '&dToxic / rude'
      icon: ROTTEN_FLESH
      reason: 'Disrespect'
      steps: ['warn', 'mute 1h', 'mute 1d', 'tempban 3d']
    advertising:
      name: '&9Advertising'
      icon: SIGN
      reason: 'Advertising'
      steps: ['mute 1d', 'tempban 7d', 'ban']
    inappropriate:
      name: '&7Bad name / skin / build'
      icon: NAME_TAG
      reason: 'Inappropriate content'
      steps: ['warn', 'kick', 'tempban 1d']
    evasion:
      name: '&4Ban evasion'
      icon: BARRIER
      reason: 'Ban evasion'
      steps: ['ban']

# ---------------------------------------------------------------------
# Spawn, rules and PvP
# ---------------------------------------------------------------------
# No building, breaking, fire, explosions or PvP around spawn (no WorldGuard needed).
# The centre is the world spawn; stand somewhere and run /servercore setspawnprotection to move it.
# Builders and admins (servercore.spawnprotection.bypass) can still build.
spawn-protection:
  enabled: true
  # Empty = the main world.
  world: ''
  # Square radius in blocks around the centre.
  radius: 48
  block-pvp: true
  # No damage at all at spawn (falling, mobs, lava...). The void still kills.
  block-all-damage: true
  # Players can't hurt animals, item frames or armor stands at spawn.
  protect-animals: true
  # Also lock chests/furnaces/hoppers at spawn (for shops or display chests).
  block-containers: false

# New players see the rules and must accept them (click or /rules accept) before they can move,
# chat or use commands. Raise "version" after changing the rules to make everyone accept again.
rules:
  require-accept: true
  version: 1
  remind-seconds: 15
  # Commands allowed before accepting (login plugins need theirs).
  allowed-commands: [login, l, log, register, reg, changepassword, changepw, captcha, rules, help, discord, link, audio]
  lines:
    - 'Be respectful. No harassment, hate speech or bullying.'
    - 'No hacking, cheat clients, x-ray or exploiting bugs.'
    - 'No griefing or stealing. Claim your land with a golden shovel.'
    - 'No spamming or advertising other servers.'
    - 'No inappropriate names, skins or builds.'
    - 'Don''t log out during a fight - you will die and drop your items.'
    - 'Listen to staff. Report problems with /helpop.'

# Combat-log protection.
combat-tag:
  enabled: true
  # How long a player stays in combat after the last hit.
  seconds: 15
  # Logging out while in combat kills the player so their items drop.
  kill-on-logout: true
  # Stop flying when tagged, and block /fly.
  disable-flight: true
  # Commands blocked while in combat. Use '*' to block all commands.
  blocked-commands: [spawn, home, homes, tpa, tpahere, tpaccept, tpyes, tp, tphere, warp, warps, back, fly, gamemode, gm, gmc, gms,
    enderchest, ec, echest, heal, feed, hat, workbench, wb, rtp, wild, afk, vanish, v, sethome, kit, kits, trade, ah, auction, auctionhouse]

# ---------------------------------------------------------------------
# Crates and keys (/crate)
# ---------------------------------------------------------------------
# Keys are virtual (stored in the database), so they can't be duplicated or faked.
# Give keys from votes, the store or the console:   crate givekey <player|all> <crate> [amount]
# Put a crate in the world: look at a chest and run /crate set <crate>. Right-click it to open,
# left-click to see the rewards.
# Rewards: "weight" is the relative chance. Each reward can give its item (give-item: true), money,
# and run console commands ({player} {uuid} {crate}). broadcast: true announces it to everyone.
# Item: material (1.8 names), amount, data, name, lore, enchants (1.8 names like DAMAGE_ALL: 3).
crates:
  enabled: true
  animation: true
  types:
    vote:
      name: '&b&lVote Crate'
      icon: CHEST
      rewards:
        money_small:
          weight: 35
          item: {material: GOLD_NUGGET, name: '&6$150'}
          money: 150
        money_big:
          weight: 15
          item: {material: GOLD_INGOT, name: '&6$500'}
          money: 500
        iron:
          weight: 20
          item: {material: IRON_INGOT, amount: 16}
          give-item: true
        food:
          weight: 15
          item: {material: COOKED_BEEF, amount: 32}
          give-item: true
        diamonds:
          weight: 10
          item: {material: DIAMOND, amount: 3}
          give-item: true
        rare_key:
          weight: 5
          item: {material: TRIPWIRE_HOOK, name: '&5Rare Crate Key'}
          commands: ['crate givekey {player} rare 1']
          broadcast: true
    rare:
      name: '&5&lRare Crate'
      icon: ENDER_CHEST
      rewards:
        money:
          weight: 30
